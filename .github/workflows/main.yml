name: CI

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/trunk' && format('ci-main-{0}', github.sha) || format('ci-main-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Set up JDK 8
      uses: actions/setup-java@v6
      with:
        distribution: liberica
        java-version: "8"
    - name: Build with Maven
      run: |
        test -x "${JAVA_HOME}/bin/javac"
        if ! "${JAVA_HOME}/bin/java" -XshowSettings:properties -version 2>&1 | grep -q 'java.vendor = BellSoft'; then
          echo "::error::JAVA_HOME is not a BellSoft JDK"
          exit 1
        fi
        export BELLSOFT_JDK8_HOME="${JAVA_HOME}"
        mvn -B -ntp package -DskipTests
