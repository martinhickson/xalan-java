name: Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g., 2.7.3-bravura-3)'
        required: true
        default: '2.7.3-bravura-3'
        type: string
      source_branch:
        description: 'Branch to release from'
        required: true
        default: 'xalan-j_2_7_1_maint'
        type: string
      run_tests:
        description: 'Run smoketest and api tests before publishing'
        required: false
        default: true
        type: boolean
      deploy_to_github_packages:
        description: 'Publish to GitHub Packages (xalan:xalan2 by default)'
        required: false
        default: true
        type: boolean
      packages_group_id:
        description: 'Maven groupId for GitHub Packages'
        required: false
        default: 'xalan'
        type: string
      artifact_id:
        description: 'Maven artifactId'
        required: false
        default: 'xalan2'
        type: string
      deploy_to_maven_central:
        description: 'Publish to Maven Central (io.github.martinhickson)'
        required: false
        default: false
        type: boolean
      central_group_id:
        description: 'Maven groupId for Maven Central (verified namespace)'
        required: false
        default: 'io.github.martinhickson'
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    env:
      RELEASE_VERSION: ${{ inputs.release_version }}
      SOURCE_BRANCH: ${{ inputs.source_branch }}
      PACKAGES_GROUP_ID: ${{ inputs.packages_group_id }}
      ARTIFACT_ID: ${{ inputs.artifact_id }}
      CENTRAL_GROUP_ID: ${{ inputs.central_group_id }}
      BRANCH_NAME: v${{ inputs.release_version }}
      TAG_NAME: v${{ inputs.release_version }}-release

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create release branch
        run: |
          git fetch origin --tags
          git checkout "${SOURCE_BRANCH}"
          git pull origin "${SOURCE_BRANCH}"
          git checkout -B "${BRANCH_NAME}"
          if git ls-remote --heads origin "${BRANCH_NAME}" | grep -q .; then
            echo "Release branch origin/${BRANCH_NAME} already exists; will not push it"
            echo "PUSH_RELEASE_BRANCH=false" >> "${GITHUB_ENV}"
          else
            echo "Created branch: ${BRANCH_NAME}"
            echo "PUSH_RELEASE_BRANCH=true" >> "${GITHUB_ENV}"
          fi
          if git ls-remote --tags origin "refs/tags/${TAG_NAME}" | grep -q .; then
            echo "Tag ${TAG_NAME} already exists; will not recreate it"
            echo "PUSH_RELEASE_TAG=false" >> "${GITHUB_ENV}"
          else
            echo "PUSH_RELEASE_TAG=true" >> "${GITHUB_ENV}"
          fi

      - name: Set the jar version
        run: |
          sed -i -E \
            's|(<property name="impl.version"[[:space:]]+value=")[^"]*(")|\1'"${RELEASE_VERSION}"'\2|' \
            build.xml
          if ! grep -q "name=\"impl.version\".*value=\"${RELEASE_VERSION}\"" build.xml; then
            echo "::error::impl.version was not updated in build.xml"
            exit 1
          fi
          grep 'name="impl.version"' build.xml

      - name: Set up JDK 8
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "8"

      - name: Build the bundled jar
        run: ant jar -Dimpl.version="${RELEASE_VERSION}"

      - name: Checkout xalan-test
        if: inputs.run_tests
        uses: actions/checkout@v7
        with:
          repository: apache/xalan-test
          path: xalan-test
          # Before the Jan 2024 encoding tests. Those expect serializer
          # surrogate fixes that are not on xalan-j_2_7_1_maint.
          ref: dcf27a66acb3d089e08a36cd0abc1b905b072be6

      - name: Run smoketest and api tests
        if: inputs.run_tests
        working-directory: xalan-test
        run: |
          sed -i 's/<javac /<javac includeantruntime="false" /g' build.xml
          ant jar extensions.classes smoketest apitest \
            -Dxalan.relpath=../ \
            -Dparser.jar=../lib/endorsed/xercesImpl.jar \
            -Dxml-apis.jar=../lib/endorsed/xml-apis.jar

      - name: Check the manifest version
        run: |
          cp "build/xalan.jar" "build/${ARTIFACT_ID}-${RELEASE_VERSION}.jar"
          cp "build/serializer.jar" "build/serializer-${RELEASE_VERSION}.jar"
          echo "ARTIFACT_PATH=build/${ARTIFACT_ID}-${RELEASE_VERSION}.jar" >> "${GITHUB_ENV}"
          echo "SERIALIZER_PATH=build/serializer-${RELEASE_VERSION}.jar" >> "${GITHUB_ENV}"
          sha256sum "build/${ARTIFACT_ID}-${RELEASE_VERSION}.jar" > "build/${ARTIFACT_ID}-${RELEASE_VERSION}.jar.sha256"
          sha256sum "build/serializer-${RELEASE_VERSION}.jar" > "build/serializer-${RELEASE_VERSION}.jar.sha256"
          echo "ARTIFACT_SHA256_PATH=build/${ARTIFACT_ID}-${RELEASE_VERSION}.jar.sha256" >> "${GITHUB_ENV}"
          echo "SERIALIZER_SHA256_PATH=build/serializer-${RELEASE_VERSION}.jar.sha256" >> "${GITHUB_ENV}"
          mismatch=$(unzip -p "build/xalan.jar" META-INF/MANIFEST.MF \
            | grep 'Implementation-Version:' \
            | grep -F -v "Implementation-Version: ${RELEASE_VERSION}" || true)
          if [ -n "$mismatch" ]; then
            echo "::error::Manifest version does not match ${RELEASE_VERSION}"
            echo "$mismatch"
            exit 1
          fi
          unzip -p "build/xalan.jar" META-INF/MANIFEST.MF | grep 'Implementation-Version:'
          serializer_mismatch=$(unzip -p "build/serializer.jar" META-INF/MANIFEST.MF \
            | grep 'Implementation-Version:' \
            | grep -F -v "Implementation-Version: ${RELEASE_VERSION}" || true)
          if [ -n "$serializer_mismatch" ]; then
            echo "::error::Serializer manifest version does not match ${RELEASE_VERSION}"
            echo "$serializer_mismatch"
            exit 1
          fi

      - name: Commit and push version change
        run: |
          git add build.xml
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Release version ${RELEASE_VERSION}"
            if [ "${PUSH_RELEASE_BRANCH}" = "true" ]; then
              git push -u origin "${BRANCH_NAME}"
            else
              echo "Skipping push of ${BRANCH_NAME} because it already exists"
            fi
          fi

      - name: Create and push tag
        run: |
          if [ "${PUSH_RELEASE_TAG}" != "true" ]; then
            echo "Tag ${TAG_NAME} already exists"
            exit 0
          fi
          git tag -a "${TAG_NAME}" -m "Release ${RELEASE_VERSION}"
          git push origin "${TAG_NAME}"

      - name: Configure Maven for GitHub Packages
        if: inputs.deploy_to_github_packages || inputs.deploy_to_maven_central
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                        http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github-packages</id>
                <username>MAVEN_GITHUB_ACTOR</username>
                <password>MAVEN_GITHUB_TOKEN</password>
              </server>
            </servers>
          </settings>
          EOF
          sed -i "s|MAVEN_GITHUB_ACTOR|${GITHUB_ACTOR}|g; s|MAVEN_GITHUB_TOKEN|${GITHUB_TOKEN}|g" ~/.m2/settings.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Write the Maven POMs
        if: inputs.deploy_to_github_packages || inputs.deploy_to_maven_central
        run: |
          write_pom() {
            local file="$1" group="$2" artifact="$3" name="$4" description="$5"
            cat > "$file" << EOF
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>${group}</groupId>
            <artifactId>${artifact}</artifactId>
            <version>${RELEASE_VERSION}</version>
            <name>${name}</name>
            <description>${description}</description>
            <url>https://github.com/martinhickson/xalan-java</url>
            <licenses>
              <license>
                <name>The Apache Software License, Version 2.0</name>
                <url>https://www.apache.org/licenses/LICENSE-2.0.txt</url>
                <distribution>repo</distribution>
              </license>
            </licenses>
            <scm>
              <connection>scm:git:https://github.com/martinhickson/xalan-java.git</connection>
              <developerConnection>scm:git:https://github.com/martinhickson/xalan-java.git</developerConnection>
              <url>https://github.com/martinhickson/xalan-java</url>
              <tag>${TAG_NAME}</tag>
            </scm>
          </project>
          EOF
          }
          write_pom "build/${ARTIFACT_ID}-${RELEASE_VERSION}.pom" \
            "${PACKAGES_GROUP_ID}" "${ARTIFACT_ID}" "Xalan-Java" \
            "Bravura maintenance build of Apache Xalan-Java 2.7.3 with the XMLReaderManager leak fix."
          write_pom "build/serializer-${RELEASE_VERSION}.pom" \
            "${PACKAGES_GROUP_ID}" "serializer" "Xalan Java Serializer" \
            "Bravura maintenance build of the Apache Xalan-Java 2.7.3 serializer."

      - name: Publish to GitHub Packages
        if: inputs.deploy_to_github_packages
        run: |
          deploy_one() {
            local artifact="$1" file="$2" pom="$3"
            set +e
            mvn -B -ntp deploy:deploy-file \
              -Dfile="$file" \
              -DpomFile="$pom" \
              -DrepositoryId=github-packages \
              -Durl="https://maven.pkg.github.com/${{ github.repository }}" \
              > /tmp/deploy.log 2>&1
            local code=$?
            set -e
            cat /tmp/deploy.log
            if [ "$code" -ne 0 ]; then
              if grep -Eqi '409|already exists|Conflict|cannot be updated' /tmp/deploy.log; then
                echo "::warning::${artifact} ${RELEASE_VERSION} is already on GitHub Packages."
              else
                exit "$code"
              fi
            fi
          }
          deploy_one "${ARTIFACT_ID}" \
            "build/${ARTIFACT_ID}-${RELEASE_VERSION}.jar" \
            "build/${ARTIFACT_ID}-${RELEASE_VERSION}.pom"
          deploy_one serializer \
            "build/serializer-${RELEASE_VERSION}.jar" \
            "build/serializer-${RELEASE_VERSION}.pom"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Maven Central configuration
        id: central
        if: inputs.deploy_to_maven_central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_CENTRAL_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_CENTRAL_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$MAVEN_CENTRAL_USERNAME" ] || [ -z "$MAVEN_CENTRAL_PASSWORD" ] || [ -z "$MAVEN_CENTRAL_GPG_PRIVATE_KEY" ]; then
            echo "::warning::Maven Central secrets are not set on this repository. Skipping Central publish."
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            echo "PUBLISH_CENTRAL=false" >> "${GITHUB_ENV}"
            exit 0
          fi
          echo "publish=true" >> "${GITHUB_OUTPUT}"
          echo "PUBLISH_CENTRAL=true" >> "${GITHUB_ENV}"

      - name: Configure Maven Central credentials
        if: inputs.deploy_to_maven_central && steps.central.outputs.publish == 'true'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          sed -i "/<\/servers>/i\\
              <server>\\
                <id>central</id>\\
                <username>${MAVEN_CENTRAL_USERNAME}</username>\\
                <password>${MAVEN_CENTRAL_PASSWORD}</password>\\
              </server>" ~/.m2/settings.xml

      - name: Import GPG signing key
        if: inputs.deploy_to_maven_central && steps.central.outputs.publish == 'true'
        env:
          MAVEN_CENTRAL_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_CENTRAL_GPG_PRIVATE_KEY }}
        run: |
          echo "${MAVEN_CENTRAL_GPG_PRIVATE_KEY}" | gpg --batch --import --pinentry-mode loopback

      - name: Publish to Maven Central
        if: inputs.deploy_to_maven_central && steps.central.outputs.publish == 'true'
        env:
          MAVEN_CENTRAL_GPG_PASSPHRASE: ${{ secrets.MAVEN_CENTRAL_GPG_PASSPHRASE }}
        run: |
          ant javadocs -Dimpl.version="${RELEASE_VERSION}"
          ant serializer.javadocs -Dimpl.version="${RELEASE_VERSION}" -Dbuild.apidocs=build/docs/serializer-apidocs
          mkdir -p build/central-extra
          jar cf "build/central-extra/${ARTIFACT_ID}-sources.jar" -C src .
          jar cf "build/central-extra/${ARTIFACT_ID}-javadoc.jar" -C build/docs/apidocs .
          jar cf "build/central-extra/serializer-sources.jar" -C src org/apache/xml/serializer
          jar cf "build/central-extra/serializer-javadoc.jar" -C build/docs/serializer-apidocs .

          publish_to_central() {
            local artifact_id="$1" jar_file="$2" sources_jar="$3" javadoc_jar="$4" pom_name="$5" pom_description="$6"
            local work="${RUNNER_TEMP}/central-${artifact_id}"
            rm -rf "$work"
            mkdir -p "$work/classes" "$work/extra"
            unzip -q "$jar_file" -d "$work/classes"
            cp "$sources_jar" "$work/extra/sources.jar"
            cp "$javadoc_jar" "$work/extra/javadoc.jar"
            cat > "$work/pom.xml" << EOF
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>${CENTRAL_GROUP_ID}</groupId>
            <artifactId>${artifact_id}</artifactId>
            <version>${RELEASE_VERSION}</version>
            <name>${pom_name}</name>
            <description>${pom_description}</description>
            <url>https://github.com/martinhickson/xalan-java</url>
            <licenses>
              <license>
                <name>The Apache Software License, Version 2.0</name>
                <url>https://www.apache.org/licenses/LICENSE-2.0.txt</url>
                <distribution>repo</distribution>
              </license>
            </licenses>
            <developers>
              <developer>
                <id>martinhickson</id>
                <name>Martin Hickson</name>
              </developer>
            </developers>
            <scm>
              <connection>scm:git:https://github.com/martinhickson/xalan-java.git</connection>
              <developerConnection>scm:git:https://github.com/martinhickson/xalan-java.git</developerConnection>
              <url>https://github.com/martinhickson/xalan-java</url>
              <tag>${TAG_NAME}</tag>
            </scm>
            <build>
              <outputDirectory>\${project.basedir}/classes</outputDirectory>
              <plugins>
                <plugin>
                  <groupId>org.apache.maven.plugins</groupId>
                  <artifactId>maven-compiler-plugin</artifactId>
                  <version>3.13.0</version>
                  <configuration>
                    <skip>true</skip>
                  </configuration>
                </plugin>
                <plugin>
                  <groupId>org.apache.maven.plugins</groupId>
                  <artifactId>maven-jar-plugin</artifactId>
                  <version>3.4.2</version>
                  <configuration>
                    <archive>
                      <manifestFile>\${project.basedir}/classes/META-INF/MANIFEST.MF</manifestFile>
                    </archive>
                  </configuration>
                </plugin>
                <plugin>
                  <groupId>org.codehaus.mojo</groupId>
                  <artifactId>build-helper-maven-plugin</artifactId>
                  <version>3.6.0</version>
                  <executions>
                    <execution>
                      <id>attach-sources-javadoc</id>
                      <phase>package</phase>
                      <goals>
                        <goal>attach-artifact</goal>
                      </goals>
                      <configuration>
                        <artifacts>
                          <artifact>
                            <file>\${project.basedir}/extra/sources.jar</file>
                            <type>jar</type>
                            <classifier>sources</classifier>
                          </artifact>
                          <artifact>
                            <file>\${project.basedir}/extra/javadoc.jar</file>
                            <type>jar</type>
                            <classifier>javadoc</classifier>
                          </artifact>
                        </artifacts>
                      </configuration>
                    </execution>
                  </executions>
                </plugin>
                <plugin>
                  <groupId>org.codehaus.mojo</groupId>
                  <artifactId>flatten-maven-plugin</artifactId>
                  <version>1.6.0</version>
                  <configuration>
                    <updatePomFile>true</updatePomFile>
                    <flattenMode>ossrh</flattenMode>
                  </configuration>
                  <executions>
                    <execution>
                      <id>flatten</id>
                      <phase>process-resources</phase>
                      <goals>
                        <goal>flatten</goal>
                      </goals>
                    </execution>
                  </executions>
                </plugin>
                <plugin>
                  <groupId>org.sonatype.central</groupId>
                  <artifactId>central-publishing-maven-plugin</artifactId>
                  <version>0.7.0</version>
                  <extensions>true</extensions>
                  <configuration>
                    <publishingServerId>central</publishingServerId>
                    <autoPublish>true</autoPublish>
                  </configuration>
                </plugin>
              </plugins>
            </build>
          </project>
          EOF
            (
              cd "$work"
              mvn -B -ntp package \
                org.apache.maven.plugins:maven-gpg-plugin:3.2.7:sign \
                org.sonatype.central:central-publishing-maven-plugin:0.7.0:publish \
                -Dgpg.passphrase="${MAVEN_CENTRAL_GPG_PASSPHRASE}"
            )
            local flat
            flat=$(find "$work" -name '.flattened-pom.xml' | head -n 1)
            if [ -z "$flat" ] || ! grep -q 'https://github.com/martinhickson/xalan-java' "$flat"; then
              echo "::error::Published POM for ${artifact_id} is missing the GitHub project URL"
              exit 1
            fi
            if grep -q '/home/runner\|outputDirectory' "$flat"; then
              echo "::error::Published POM for ${artifact_id} still contains build paths"
              exit 1
            fi
          }

          publish_to_central "${ARTIFACT_ID}" \
            "build/${ARTIFACT_ID}-${RELEASE_VERSION}.jar" \
            "build/central-extra/${ARTIFACT_ID}-sources.jar" \
            "build/central-extra/${ARTIFACT_ID}-javadoc.jar" \
            "Xalan-Java" \
            "Bravura maintenance build of Apache Xalan-Java 2.7.3 with the XMLReaderManager leak fix."
          publish_to_central serializer \
            "build/serializer-${RELEASE_VERSION}.jar" \
            "build/central-extra/serializer-sources.jar" \
            "build/central-extra/serializer-javadoc.jar" \
            "Xalan Java Serializer" \
            "Bravura maintenance build of the Apache Xalan-Java 2.7.3 serializer."

      - name: Prepare GitHub release notes
        run: |
          {
            echo "RELEASE_BODY<<EOF"
            echo "Release ${RELEASE_VERSION} of Xalan-Java."
            echo ""
            echo "Previous Bravura coordinate: xalan:xalan2:2.7.3.bravura.2"
            echo ""
            echo "Coordinates:"
            echo '```xml'
            echo "<dependency>"
            echo "  <groupId>${PACKAGES_GROUP_ID}</groupId>"
            echo "  <artifactId>${ARTIFACT_ID}</artifactId>"
            echo "  <version>${RELEASE_VERSION}</version>"
            echo "</dependency>"
            echo "<dependency>"
            echo "  <groupId>${PACKAGES_GROUP_ID}</groupId>"
            echo "  <artifactId>serializer</artifactId>"
            echo "  <version>${RELEASE_VERSION}</version>"
            echo "</dependency>"
            echo '```'
            echo ""
            echo "- Release branch: ${BRANCH_NAME}"
            echo "- Tag: ${TAG_NAME}"
            if [ "${{ inputs.deploy_to_github_packages }}" = "true" ]; then
              echo "- Published to GitHub Packages"
            fi
            if [ "${PUBLISH_CENTRAL}" = "true" ]; then
              echo "- Published to Maven Central under ${CENTRAL_GROUP_ID}"
            fi
            echo "EOF"
          } >> "${GITHUB_ENV}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts-${{ inputs.release_version }}
          path: |
            build/${{ inputs.artifact_id }}-${{ inputs.release_version }}.jar
            build/${{ inputs.artifact_id }}-${{ inputs.release_version }}.jar.sha256
            build/serializer-${{ inputs.release_version }}.jar
            build/serializer-${{ inputs.release_version }}.jar.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ inputs.release_version }}
          body: ${{ env.RELEASE_BODY }}
          draft: false
          prerelease: false
          files: |
            ${{ env.ARTIFACT_PATH }}
            ${{ env.ARTIFACT_SHA256_PATH }}
            ${{ env.SERIALIZER_PATH }}
            ${{ env.SERIALIZER_SHA256_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
