name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - xalan-j_2_7_1_maint

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 8
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "8"

      - name: Build the bundled xalan.jar
        # Fails if lib/endorsed/xercesImpl.jar is missing. That jar is
        # required to compile IncrementalSAXSource_Xerces.
        # ant jar also builds build/serializer.jar. The upstream dist
        # ships that jar beside xalan.jar.
        run: ant jar

      - name: Upload jars
        uses: actions/upload-artifact@v7
        with:
          name: xalan-jars
          path: |
            build/xalan.jar
            build/serializer.jar
          if-no-files-found: error
